<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan to Violet Gradient -->
    <linearGradient id="vigilonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="40" fill="url(#pulseGlow)" />

  <!-- Hexagonal Shield Outline -->
  <polygon 
    points="50,8 88,28 88,72 50,92 12,72 12,28" 
    stroke="url(#vigilonGrad)" 
    stroke-width="6" 
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Inner Radar-Sweep / Electro-Pulse Arc Line -->
  <path 
    d="M26,50 L40,50 L46,36 L54,64 L60,46 L66,50 L74,50" 
    stroke="#22D3EE" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Central Pulse Node Core -->
  <circle cx="50" cy="50" r="4" fill="#8B5CF6" stroke="#22D3EE" stroke-width="2" />
</svg>
